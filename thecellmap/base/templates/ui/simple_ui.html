{% load staticfiles base_extras %}

<div class="top-left hidden-sm hidden-xs">
  <div class="btn-group hidden" data-simple-step="2">
    <button type="button" class="btn btn-default btn-zoom-in" data-toggle="tooltip" data-placement="top" data-delay="200" title="Zoom in" data-container=".vizualization-ui">
      <span class="glyphicon glyphicon-zoom-in"></span>
    </button>
    <button type="button" class="btn btn-default btn-home" data-toggle="tooltip" data-placement="top" data-delay="200" title="Center view and adjust zoom" data-container=".vizualization-ui">
      <span class="glyphicon glyphicon-record"></span>
    </button>
    <button type="button" class="btn btn-default btn-zoom-out" data-toggle="tooltip" data-placement="top" data-delay="200" title="Zoom out" data-container=".vizualization-ui">
      <span class="glyphicon glyphicon-zoom-out"></span>
    </button>
  </div>
  
  <div style="position: relative; display: inline-block; vertical-align: middle;" data-simple-step="1">
    <div class="input-group search-bar">
      <span class="input-group-addon glyphicon glyphicon-search"></span>
      <input class="gene-search-input form-control" type="hidden">
    </div>
  </div>
</div>

<div class="top-right-simple hidden-sm hidden-xs">
  <div class="btn-group-simple hidden" data-simple-step="1">
    <button id="download-selected-simple" type="button" class="btn btn-primary" data-selection-constraint data-selection-gt="0" data-selection-lt="20"> Download table</button>
    <button id="view-network-simple" type="button" class="btn btn-primary" data-selection-constraint data-selection-gt="0"> View Network </button>
  </div>
  
  <div class="cutoff-bar-group hidden" data-simple-step="2">
    <div id="cutoff-bar-cor-simple" class="cutoff-bar-simple cutoff-cor" data-dataset="0" data-orientation="horizontal" data-dir="ltr"></div>
    <button id="cutoff-label-min-simple" type="button" class="btn btn-default cutoff-label-simple cutoff-label-min" data-placement="bottom"></button>
    <div id="cutoff-bar-int-simple" class="cutoff-bar-simple cutoff-int" data-dataset="1" data-orientation="horizontal" style="display: none;"></div>
    <button id="cutoff-label-max-simple" type="button" class="btn btn-success cutoff-label-simple cutoff-label-max" data-placement="bottom" style="visibility: hidden;">&nbsp;</button>
  </div>
</div>
