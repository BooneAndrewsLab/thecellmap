{% extends "ui/base_ui.html" %}
{% load staticfiles  %}

{% block uiElements %}
  <div class="top-left">
    <div class="btn-group hidden" id="dataset-toggle" data-toggle-name="switch-dataset" data-simple-step="2" data-toggle="buttons">
      <label class="btn btn-primary active" data-dataset="0" data-title="Switch to profile similarity network" >
        <input type="radio" data-dataset="0" name="selectedDataset" autocomplete="off" checked> Profile similarity network
      </label>
      <label class="btn btn-primary" data-dataset="1" data-title="Switch to genetic interaction network">
        <input type="radio" data-dataset="1" name="selectedDataset" autocomplete="off"> Genetic interaction network
      </label>
    </div>
    
    <div class="select2-div" data-simple-step="1">
      <div class="input-group search-bar hidden-xs">
        <input class="gene-search-input form-control" type="hidden">
      </div>
      <div class="visible-xs-block">
        <button type="button" class="btn btn-default btn-show-search" data-toggle="modal" data-target="#modal-search">
            <span class="glyphicon glyphicon-search"></span>
        </button>
      </div>
    </div>
  </div>
  
  <div class="middle-right hidden" data-simple-step="2">
    <button id="cutoff-label-max" type="button" class="btn btn-success cutoff-label cutoff-label-max" style="visibility: hidden;">&nbsp;</button>
    
    <div id="cutoff-bar-cor" class="cutoff-bar cutoff-cor" data-dataset="0" data-orientation="vertical" data-direction="rtl"></div>
    <div id="cutoff-bar-int" class="cutoff-bar cutoff-int" data-dataset="1" data-orientation="vertical" style="display: none;"></div>
    
    <button id="cutoff-label-min" type="button" class="btn btn-default cutoff-label cutoff-label-min"></button>
    
    <div class="btn-group-vertical">
      <button type="button" class="btn btn-default btn-zoom-in" data-toggle="tooltip" data-placement="bottom" data-delay="200" title="Zoom in" data-container=".vizualization-ui">
        <span class="glyphicon glyphicon-zoom-in"></span>
      </button>
      <button type="button" class="btn btn-default btn-home" data-toggle="tooltip" data-placement="bottom" data-delay="200" title="Center view and adjust zoom" data-container=".vizualization-ui">
        <span class="glyphicon glyphicon-record"></span>
      </button>
      <button type="button" class="btn btn-default btn-zoom-out" data-toggle="tooltip" data-placement="bottom" data-delay="200" title="Zoom out" data-container=".vizualization-ui">
        <span class="glyphicon glyphicon-zoom-out"></span>
      </button>
    </div>
  </div>
  
  <div class="top-right-simple">
    <div class="btn-group-simple hidden" data-simple-step="1" data-simple-keep="true">
      <div class="dropdown inline-button-grp" data-simple-step="2">
        <button class="btn btn-primary dropdown-toggle" type="button" id="dropdownMenu1" data-toggle="dropdown" aria-haspopup="true" aria-expanded="true">
          Annotate network
          <span class="caret"></span>
        </button>
        <ul class="dropdown-menu btn-group-annotation" aria-labelledby="dropdownMenu1">
        </ul>
      </div>
      
      <button id="view-network-simple" type="button" class="btn btn-primary" data-selection-constraint data-selection-gt="0" data-selection-lt="20" data-selection-disabled-title="Please select up to 20 nodes"> Extract Subnetwork </button>
      <button id="btn-view-tabular" type="button" class="btn btn-primary" data-selection-constraint data-selection-gt="0" data-selection-lt="20" data-selection-disabled-title="Please select up to 20 nodes" data-toggle="tooltip" data-placement="bottom"> View as table</button>
      <button id="download-selected-simple" type="button" class="btn btn-primary" data-selection-constraint data-selection-gt="0" data-selection-lt="20" data-selection-disabled-title="Please select up to 20 nodes" data-toggle="tooltip" data-placement="bottom"> Download</button>
    </div>
  </div>
  
  <div class="modal fade" id="modal-search" tabindex="-1" role="dialog">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-body">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
